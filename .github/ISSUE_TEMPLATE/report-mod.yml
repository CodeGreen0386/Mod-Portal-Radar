name: Report Mod
description: Report a mod for AI usage.
title: "Report: "
labels: ["report"]
body:
  - type: input
    id: url
    attributes:
      label: Mod URL
      description: The link to the mod on the mod portal.
      placeholder: https://mods.factorio.com/mod/<mod-name>
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: AI Usage
      description: In what ways the mod uses AI.
      options:
        - label: Code
        - label: Graphics
        - label: Text
        - label: Thumbnail
  - type: textarea
    id: info
    attributes:
      label: Additional info
      description: Any other necessary information, can be left blank.