name: Report accepted
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  process:
    if: github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Process report
        env:
          ISSUE_BODY: ${{github.event.issue.body}}
        run: node scripts/report.js
      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{github.event.issue.number}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/
          git commit -m "Report #$ISSUE_NUMBER: $MOD_NAME"
          git push origin master
      - name: Close issue
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          ISSUE_NUMBER: ${{github.event.issue.number}}
        run: gh issue close "$ISSUE_NUMBER" --reason completed